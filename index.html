<!-- Rock Paper Scissors -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Rock Paper Scissors</h1>
    <p>First to 5 wins.</p>
    <div>
      <button data-c="rock">Rock</button><button data-c="paper">Paper</button
      ><button data-c="scissors">Scissors</button>
    </div>
    <div id="score">You 0 - 0 Computer</div>
    <div id="log"></div>
    <button id="reset" hidden>Play again</button>
    <script src="script.js" defer></script>
  </body>
</html>
